name: Nightly Telegram update

on:
  schedule:
    # 9:07 PM in Vancouver is 04:07 UTC in summer and 05:07 UTC in winter. Both run;
    # the script only sends from the one that lands at 9 PM local time.
    - cron: "7 4,5 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options:
          - Send a test message
          - Find my group
        default: Send a test message

permissions:
  contents: write

concurrency: nightly-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Post to Telegram
        run: python3 scripts/nightly_update.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name != 'workflow_dispatch' && 'nightly' || inputs.action == 'Find my group' && 'find-group' || 'test' }}

      # Remembering when it was sent also keeps the repo active, so GitHub doesn't pause the schedule.
      - name: Remember when it was sent
        run: |
          git add update-state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly update sent"
          git pull --rebase
          git push
