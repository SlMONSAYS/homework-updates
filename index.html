<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simon's Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* Forest-at-night palette, matching simon's little corner */
  :root {
    --bg: #151815;
    --text: #e4dfd6;       /* warm cream */
    --muted: #8a857b;
    --accent: #7ba576;     /* muted forest green */
    --wood: #a08b72;
    --border: rgba(255, 255, 255, 0.08);
    --card: rgba(22, 25, 22, 0.55);
    --red: #e08a7c;        /* ember red: overdue */
    --red-bg: rgba(224, 138, 124, 0.14);
    --yellow: #e3c06b;     /* lamplight amber: due this week */
    --yellow-bg: rgba(227, 192, 107, 0.14);
    --pink: #e8a3c4;
    --pink-bg: rgba(232, 163, 196, 0.12);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font: 17px/1.6 "Lora", Georgia, serif;
    background-color: var(--bg);
    /* Dark watercolour wash: forest green, slate blue, a hint of lamplight */
    background-image:
      radial-gradient(ellipse 80% 60% at 15% 20%, rgba(45, 72, 50, 0.35), rgba(45, 72, 50, 0.12) 40%, transparent 70%),
      radial-gradient(ellipse 70% 80% at 80% 35%, rgba(42, 55, 68, 0.30), rgba(42, 55, 68, 0.10) 45%, transparent 75%),
      radial-gradient(ellipse 90% 50% at 50% 90%, rgba(35, 60, 40, 0.40), rgba(35, 60, 40, 0.15) 35%, transparent 65%),
      radial-gradient(ellipse 50% 45% at 70% 10%, rgba(38, 62, 60, 0.25), rgba(38, 62, 60, 0.08) 50%, transparent 80%),
      radial-gradient(ellipse 30% 25% at 25% 85%, rgba(70, 65, 48, 0.18), rgba(70, 65, 48, 0.05) 50%, transparent 80%);
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  main { max-width: 600px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { font-weight: 600; font-size: 1.9rem; line-height: 1.2; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(24px) saturate(1.1);
    backdrop-filter: blur(24px) saturate(1.1);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-left: 4px solid;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 1.2rem; font-weight: 600; margin: 0 0 6px; }
  .overdue { border-left-color: var(--red); }
  .overdue h2 { color: var(--red); }
  .week { border-left-color: var(--yellow); }
  .week h2 { color: var(--yellow); }
  h3 { font-weight: 600; font-size: 1.05rem; color: var(--text); margin: 12px 0 0; padding-top: 8px; border-top: 1px solid var(--border); }
  h2 + div > h3:first-child { border-top: none; padding-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 7px 0; border-top: 1px solid var(--border);
  }
  li:first-child { border-top: none; }
  .when {
    font-family: "Inter", system-ui, sans-serif; white-space: nowrap; font-size: 0.8rem; font-weight: 600;
    padding: 2px 9px; border-radius: 6px; align-self: flex-start; margin-top: 2px;
  }
  .overdue .when { color: var(--red); background: var(--red-bg); }
  .week .when { color: var(--yellow); background: var(--yellow-bg); }
  .empty { color: var(--muted); font-size: 0.95rem; margin: 0 0 2px; }
  .later { color: var(--wood); font-size: 0.95rem; margin: 10px 0 0; }
  .later:empty { display: none; }
  .note {
    background: var(--pink-bg); color: var(--pink);
    border: 1px solid rgba(232, 163, 196, 0.25);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.95rem;
  }
  .note code { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Simon's Homework</h1>
  <div id="note"></div>
  <section class="card overdue">
    <h2>Overdue</h2>
    <div id="overdue"><p class="empty">Loading…</p></div>
  </section>
  <section class="card week">
    <h2>Due this week</h2>
    <div id="week"><p class="empty">Loading…</p></div>
    <p class="later" id="later"></p>
  </section>
</main>
<script>
  const CLASSES = [
    "Humanities 12",
    "Math 11",
    "Anatomy and Physiology 12",
    "Chemistry 11",
    "Careers 12",
    "PE 12",
    "Psychology 12"
  ];
  const DAY = 24 * 60 * 60 * 1000;

  function startOfToday() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  // Parses "YYYY-MM-DD" as a local date; returns null if it isn't a real date.
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) return null;
    return d;
  }

  function parse(text) {
    const items = [], bad = [];
    text.split(/\r?\n/).forEach((raw, i) => {
      const line = raw.trim();
      if (!line || line.startsWith("#")) return;
      const parts = line.split("|").map(p => p.trim());
      const due = parts.length >= 3 ? parseDate(parts[0]) : null;
      const title = parts.slice(2).join(" | ");
      if (!due || !parts[1] || !title) { bad.push({ n: i + 1, line }); return; }
      // Match class names case-insensitively so small typos in capitalisation still group correctly.
      const known = CLASSES.find(c => c.toLowerCase() === parts[1].toLowerCase());
      items.push({ due, cls: known || parts[1], title });
    });
    return { items, bad };
  }

  function classRank(cls) {
    const i = CLASSES.indexOf(cls);
    return i === -1 ? CLASSES.length : i;
  }

  function fmt(d) {
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderList(container, items, label) {
    container.replaceChildren();
    items.sort((a, b) => a.due - b.due);
    // Every class gets a heading, even with nothing due; unknown class names go at the end.
    const extra = [...new Set(items.map(it => it.cls).filter(c => !CLASSES.includes(c)))].sort();
    for (const cls of [...CLASSES, ...extra]) {
      container.append(el("h3", null, cls));
      const mine = items.filter(it => it.cls === cls);
      if (!mine.length) { container.append(el("p", "empty", "Nothing")); continue; }
      const ul = el("ul");
      for (const it of mine) {
        const li = el("li");
        li.append(el("span", null, it.title), el("span", "when", label(it)));
        ul.append(li);
      }
      container.append(ul);
    }
  }


  function render(text) {
    const today = startOfToday();
    // This coming Sunday (today if it's already Sunday).
    const sunday = new Date(today.getTime() + ((7 - today.getDay()) % 7) * DAY);
    const { items, bad } = parse(text);

    const overdue = items.filter(it => it.due < today);
    const week = items.filter(it => it.due >= today && it.due <= sunday);
    const later = items.filter(it => it.due > sunday).length;

    renderList(document.getElementById("overdue"), overdue, it => {
      const n = Math.round((today - it.due) / DAY);
      return n === 1 ? "1 day late" : n + " days late";
    });

    renderList(document.getElementById("week"), week, it =>
      it.due.getTime() === today.getTime() ? "Today" : fmt(it.due));

    document.getElementById("later").textContent =
      later ? later + " more due after this week" : "";

    const note = document.getElementById("note");
    note.replaceChildren();
    if (bad.length) {
      const box = el("div", "note");
      box.append(el("strong", null, bad.length === 1
        ? "One line in homework.txt couldn't be read:"
        : bad.length + " lines in homework.txt couldn't be read:"));
      for (const b of bad) {
        const p = el("div");
        p.append("Line " + b.n + ": ", el("code", null, b.line));
        box.append(p);
      }
      note.append(box);
    }
  }

  fetch("homework.txt", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(render)
    .catch(() => {
      document.getElementById("overdue").replaceChildren(el("p", "empty", "Couldn't load homework.txt."));
      document.getElementById("week").replaceChildren(el("p", "empty", "Couldn't load homework.txt."));
    });
</script>
</body>
</html>
